name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject deploy info into HTML
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/__DEPLOY_DATE__/${TODAY}/g; s/__COMMIT_SHA__/${SHORT_SHA}/g" index.html
          echo "Injected: $TODAY / $SHORT_SHA"
          cat index.html | grep footer

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
